# Section 10.1 curated benchmark set (the committed "headline" run).
# Scenario family: even (bucketed), first-k agents. Timeout: 60 s per
# (instance, solver). Arms: cbs (default options), pp-fixed,
# pp-best-of-8 (seed 42).
label: headline
budget_ms: 60000
scenario: even
arms:
  - name: cbs
    options:
      tie_break: fifo
    seed: null
  - name: pp-fixed
    options: {}
    seed: null
  - name: pp-best-of-n
    options:
      orderings: 8
    seed: 42
cells:
  - map: empty-16-16
    agents: [5, 10, 20, 40]
  - map: random-32-32-10
    agents: [5, 10, 20, 40]
  - map: random-32-32-20
    agents: [5, 10, 20]
  - map: maze-32-32-2
    agents: [5, 10, 20]
  - map: room-32-32-4
    agents: [5, 10, 20]
  - map: warehouse-10-20-10-2-1
    agents: [5, 10, 20, 40]
  - map: ht_chantry
    agents: [5, 10, 20]
