name: Pages

on:
  push:
    branches: ['main']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable && corepack prepare pnpm@12.6.0 --activate
      # Derive the project-page subpath from the origin repo name so assets,
      # navigation and the SPA fallback resolve under
      # https://<user>.github.io/<repo>/. VITE_BASE_PATH is written into a
      # gitignored .env so Vite's loadEnv() reads it reliably at build time.
      # Locally (no .env) base falls back to '/'.
      - run: |
          REPO_NAME="$(git remote get-url origin | sed -n 's#.*/\([^/]*\)\.git#\1#p')"
          echo "VITE_BASE_PATH=/$REPO_NAME/" > frontend/.env
          echo "BASE_PATH=/$REPO_NAME/" >> frontend/.env
          cat frontend/.env
      - run: pnpm -C frontend install --frozen-lockfile
      - run: pnpm -C frontend typecheck
      - run: pnpm -C frontend test
      - run: pnpm -C frontend build
      # SPA fallback: hard-refreshed deep links (e.g. /workspace) hit GitHub
      # Pages' 404, so serve the built SPA there too; the router reads the
      # preserved pathname and renders the right route.
      - run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - uses: actions/deploy-pages@v4
        id: deployment
