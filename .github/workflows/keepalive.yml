name: Keep-Alive Backend

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend health endpoint
        run: |
          curl -sSf https://swarmway.onrender.com/api/health || exit 0
          echo "Backend is alive"
